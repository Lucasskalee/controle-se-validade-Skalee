      <image href="eye-left.png" x="358" y="334" width="88" height="134" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="358" y="334" width="88" height="134" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="364" y="350" display="none">eye-left</text>
      <circle class="skalito-pivot-marker" cx="402" cy="401" r="5" fill="#00d9ff" stroke="#fff" stroke-width="1.5" display="none" />
    </g>
    <!-- Olho Direito -->
    <g id="eye-right" class="skalito-piece piece-eye-right" data-pivot-x="546" data-pivot-y="405" style="transform-origin: 546px 405px;">
      <image href="eye-right.png" x="496" y="338" width="100" height="134" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="496" y="338" width="100" height="134" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="502" y="354" display="none">eye-right</text>
      <circle class="skalito-pivot-marker" cx="546" cy="405" r="5" fill="#00d9ff" stroke="#fff" stroke-width="1.5" display="none" />
    </g>
    <g class="skalito-validation-guide" aria-hidden="true">
      <rect class="skalito-debug-box" x="332" y="66" width="335" height="150" rx="0" ry="0" fill="none" display="none" />
