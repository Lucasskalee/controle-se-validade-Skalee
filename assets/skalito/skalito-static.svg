<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="Mascote Skalito">
  <g id="skalito-root" class="skalito-root" style="transform-origin: 500px 750px;">
    <!-- Asa Esquerda -->
    <g id="wing-left" class="skalito-piece piece-wing-left" data-pivot-x="440" data-pivot-y="550" style="transform-origin: 440px 550px;">
      <image href="wing-left.png" x="130" y="440" width="370" height="220" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Asa Direita -->
    <g id="wing-right" class="skalito-piece piece-wing-right" data-pivot-x="580" data-pivot-y="560" style="transform-origin: 580px 560px;">
      <image href="wing-right.png" x="520" y="430" width="420" height="250" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Corpo, Pernas e Cauda -->
    <g id="body-lower" class="skalito-piece piece-body-lower" data-pivot-x="500" data-pivot-y="880" style="transform-origin: 500px 880px;">
      <image href="body-lower.png" x="230" y="530" width="670" height="380" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Braço Direito (Repouso) -->
    <g id="arm-right" class="skalito-piece piece-arm-right" data-pivot-x="590" data-pivot-y="600" style="transform-origin: 590px 600px;">
      <image href="arm-right.png" x="540" y="570" width="140" height="210" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Cabeça -->
    <g id="head" class="skalito-piece piece-head" data-pivot-x="510" data-pivot-y="580" style="transform-origin: 510px 580px;">
      <image href="head.png" x="270" y="130" width="480" height="530" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Olho Esquerdo -->
    <g id="eye-left" class="skalito-piece piece-eye-left" data-pivot-x="382" data-pivot-y="412" style="transform-origin: 382px 412px;">
      <image href="eye-left.png" x="345" y="360" width="75" height="105" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Olho Direito -->
    <g id="eye-right" class="skalito-piece piece-eye-right" data-pivot-x="565" data-pivot-y="417" style="transform-origin: 565px 417px;">
      <image href="eye-right.png" x="520" y="365" width="90" height="105" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Bandana / Colar Skalee -->
    <g id="collar" class="skalito-piece piece-collar" data-pivot-x="475" data-pivot-y="580" style="transform-origin: 475px 580px;">
      <image href="collar.png" x="350" y="515" width="250" height="240" preserveAspectRatio="xMidYMid meet" />
    </g>
    <!-- Braço Esquerdo (Acenando) -->
    <g id="arm-left" class="skalito-piece piece-arm-left" data-pivot-x="380" data-pivot-y="570" style="transform-origin: 380px 570px;">
      <image href="arm-left.png" x="160" y="470" width="260" height="170" preserveAspectRatio="xMidYMid meet" />
    </g>
  </g>
</svg>