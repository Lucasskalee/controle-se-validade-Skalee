      <text class="skalito-debug-label" x="324" y="504" display="none">neck/scarf</text>
    </g>
    <g class="skalito-validation-guide" aria-hidden="true">
      <rect class="skalito-debug-box" x="330" y="580" width="330" height="210" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="336" y="596" display="none">torso</text>
    </g>
    <g class="skalito-validation-guide" aria-hidden="true">
      <rect class="skalito-debug-box" x="280" y="710" width="390" height="170" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="286" y="726" display="none">legs</text>
    </g>
    <g class="skalito-validation-guide" aria-hidden="true">
      <rect class="skalito-debug-box" x="258" y="844" width="430" height="104" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="264" y="860" display="none">feet</text>
    </g>
    <g class="skalito-validation-guide" aria-hidden="true">
      <rect class="skalito-debug-box" x="630" y="652" width="230" height="210" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="636" y="668" display="none">tail</text>
