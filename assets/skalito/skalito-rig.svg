<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="Mascote Skalito">
  <g id="skalito-root" class="skalito-root" style="transform-origin: 500px 790px;">
    <!-- Asa Esquerda -->
    <g id="wing-left" class="skalito-piece piece-wing-left" data-pivot-x="386" data-pivot-y="570" style="transform-origin: 386px 570px;">
      <image href="wing-right.png" x="96" y="430" width="320" height="225" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="96" y="430" width="320" height="225" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="102" y="446" display="none">wing-left</text>
      <circle class="skalito-pivot-marker" cx="386" cy="570" r="7" fill="#ff4057" stroke="#fff" stroke-width="2" display="none" />
    </g>
    <!-- Asa Direita -->
    <g id="wing-right" class="skalito-piece piece-wing-right" data-pivot-x="616" data-pivot-y="570" style="transform-origin: 616px 570px;">
      <image href="wing-left.png" x="548" y="420" width="388" height="244" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="548" y="420" width="388" height="244" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="554" y="436" display="none">wing-right</text>
      <circle class="skalito-pivot-marker" cx="616" cy="570" r="7" fill="#ff4057" stroke="#fff" stroke-width="2" display="none" />
    </g>
    <!-- Corpo, Pernas e Cauda -->
    <g id="body-lower" class="skalito-piece piece-body-lower" data-pivot-x="500" data-pivot-y="908" style="transform-origin: 500px 908px;">
      <image href="body-lower.png" x="240" y="498" width="620" height="450" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="240" y="498" width="620" height="450" rx="0" ry="0" fill="none" display="none" />
      <text class="skalito-debug-label" x="246" y="514" display="none">body-lower</text>
      <circle class="skalito-pivot-marker" cx="500" cy="908" r="7" fill="#ff4057" stroke="#fff" stroke-width="2" display="none" />
    </g>
    <!-- Bandana / Jaleco Skalee (Atrás da Cabeça) -->
    <g id="collar" class="skalito-piece piece-collar" data-pivot-x="488" data-pivot-y="572" style="transform-origin: 488px 572px;">
      <image href="collar.png" x="318" y="488" width="340" height="270" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="318" y="488" width="340" height="270" rx="0" ry="0" fill="none" display="none" />
