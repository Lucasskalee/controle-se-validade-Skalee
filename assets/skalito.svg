<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 380 430"
  role="img"
  aria-labelledby="skalito-title skalito-desc"
  id="skalito-mascot-svg"
>
  <title id="skalito-title">Skalito</title>
  <desc id="skalito-desc">Mascote dragão cibernético oficial da Skalee.</desc>
  <defs>
    <!-- Gradiente do Corpo / Escamas -->
    <linearGradient id="skalito-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>

    <!-- Gradiente Metálico dos Chifres -->
    <linearGradient id="skalito-horn-gradient" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Gradiente das Asas (Ciano Neon) -->
    <linearGradient id="skalito-wing-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0756d8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Gradientes Neon -->
    <linearGradient id="skalito-cyan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="skalito-red-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#ff4057"/>
    </linearGradient>

    <!-- Efeito de Brilho Neon (Glow) -->
    <filter id="skalito-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="skalito-eye-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="skalito-shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- SOMBRA DE CHÃO PULSANTE -->
  <ellipse
    id="skalito-shadow"
    cx="190"
    cy="402"
    rx="84"
    ry="14"
    fill="#000000"
    opacity="0.45"
    filter="url(#skalito-shadow-blur)"
  />

  <!-- PARTÍCULAS CYBER / EMBERS (FUNDO) -->
  <g id="skalito-particles-back" opacity="0.8">
    <circle id="skalito-particle-1" cx="55" cy="190" r="3" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-2" cx="330" cy="270" r="2.5" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-3" cx="320" cy="120" r="2" fill="#38bdf8" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-4" cx="70" cy="290" r="2.2" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
  </g>

  <!-- CAUDA DO DRAGÃO -->
  <g id="skalito-tail">
    <!-- Estrutura principal da cauda -->
    <path
      d="
        M242 300
        C325 285 352 338 312 360
        C285 372 260 358 286 344
        C298 338 294 322 268 322
        L242 322 Z
      "
      fill="url(#skalito-body-gradient)"
      stroke="#0f2133"
      stroke-width="3"
    />
    <!-- Espinhos dorsais da cauda -->
    <path d="M302 336 L316 322 L315 342 Z" fill="#0d1827" stroke="#00d9ff" stroke-width="2" filter="url(#skalito-soft-glow)"/>
    <path d="M284 330 L296 316 L295 334 Z" fill="#0d1827" stroke="#00d9ff" stroke-width="2"/>
    <path d="M264 324 L274 312 L274 328 Z" fill="#0d1827" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Linhas de circuito na cauda -->
    <path d="M256 312 L276 312 L288 332 L308 340" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect x="296" y="328" width="6" height="6" fill="none" stroke="#ff4057" stroke-width="2" transform="rotate(45 299 331)"/>
  </g>

  <!-- ASA ESQUERDA (TRANSLÚCIDA COM NEON) -->
  <g id="skalito-wing-left">
    <!-- Membrana luminosa -->
    <path
      d="
        M124 200
        C78 170 48 185 24 235
        C55 218 78 230 84 256
        C102 236 116 230 134 242
        Z
      "
      fill="url(#skalito-wing-gradient)"
      opacity="0.85"
    />
    <!-- Estrutura / Ossos da Asa -->
    <path
      d="
        M124 200
        C78 170 48 185 24 235
        C55 218 78 230 84 256
        C102 236 116 230 134 242
        Z
      "
      fill="none"
      stroke="#0f2133"
      stroke-width="3.5"
    />
    <!-- Nervuras com Glow Azul/Ciano -->
    <path d="M30 230 Q74 206 122 226" fill="none" stroke="#00d9ff" stroke-width="2.5" opacity="0.9" filter="url(#skalito-soft-glow)"/>
    <path d="M84 254 Q98 226 126 216" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
    <circle cx="25" cy="233" r="3.5" fill="#0d1827" stroke="#00d9ff" stroke-width="1.5"/>
  </g>

  <!-- ASA DIREITA (TRANSLÚCIDA COM NEON) -->
  <g id="skalito-wing-right">
    <!-- Membrana luminosa -->
    <path
      d="
        M256 200
        C302 170 332 185 356 235
        C325 218 302 230 296 256
        C278 236 264 230 246 242
        Z
      "
      fill="url(#skalito-wing-gradient)"
      opacity="0.9"
    />
    <!-- Estrutura / Ossos da Asa -->
    <path
      d="
        M256 200
        C302 170 332 185 356 235
        C325 218 302 230 296 256
        C278 236 264 230 246 242
        Z
      "
      fill="none"
      stroke="#0f2133"
      stroke-width="3.5"
    />
    <!-- Nervuras com Glow Azul/Ciano -->
    <path d="M350 230 Q306 206 258 226" fill="none" stroke="#00d9ff" stroke-width="2.5" opacity="0.95" filter="url(#skalito-soft-glow)"/>
    <path d="M296 254 Q282 226 254 216" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
    <circle cx="355" cy="233" r="3.5" fill="#0d1827" stroke="#00d9ff" stroke-width="1.5"/>
  </g>

  <!-- PERNAS E PATAS -->
  <g id="skalito-legs">
    <!-- Perna Esquerda -->
    <g id="skalito-leg-left">
      <path
        d="
          M134 340
          C110 348 102 380 120 395
          C138 406 166 398 168 376
          C167 358 153 344 134 340
          Z
        "
        fill="url(#skalito-body-gradient)"
        stroke="#162638"
        stroke-width="3"
      />
      <!-- Garras arredondadas -->
      <path d="M120 392 Q124 380 128 392 Q134 378 138 393 Q144 380 148 394" fill="#09101a" stroke="#253a50" stroke-width="2" stroke-linejoin="round"/>
      <!-- Circuito cibernético na perna -->
      <path d="M130 360 L140 372 L150 364" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <rect x="138" y="366" width="5" height="5" fill="none" stroke="#00d9ff" stroke-width="1.5" transform="rotate(45 140.5 368.5)"/>
    </g>

    <!-- Perna Direita -->
    <g id="skalito-leg-right">
      <path
        d="
          M246 340
          C270 348 278 380 260 395
          C242 406 214 398 212 376
          C213 358 227 344 246 340
          Z
        "
        fill="url(#skalito-body-gradient)"
        stroke="#162638"
        stroke-width="3"
      />
      <!-- Garras arredondadas -->
      <path d="M232 394 Q236 380 242 393 Q246 378 252 392 Q256 380 260 392" fill="#09101a" stroke="#253a50" stroke-width="2" stroke-linejoin="round"/>
      <!-- Circuito cibernético na perna -->
      <path d="M236 352 L228 370 L242 380" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <rect x="225" y="366" width="5" height="5" fill="none" stroke="#00d9ff" stroke-width="1.5" transform="rotate(45 227.5 368.5)"/>
    </g>
  </g>

  <!-- CORPO DO DRAGÃO -->
  <g id="skalito-body">
    <!-- Tronco Principal -->
    <path
      d="
        M120 236
        C124 196 150 178 190 178
        C230 178 256 196 260 236
        L268 322
        C269 368 232 390 190 390
        C148 390 111 368 112 322
        Z
      "
      fill="url(#skalito-body-gradient)"
      stroke="#182c40"
      stroke-width="3.5"
    />

    <!-- Barriga / Placas Ventrais -->
    <path
      id="skalito-belly"
      d="
        M156 242
        C166 230 214 230 224 242
        L220 338
        C218 360 162 360 160 338
        Z
      "
      fill="#0c1522"
      stroke="#1e344a"
      stroke-width="2.5"
    />

    <!-- Divisões das Placas Ventrais com Glow -->
    <path d="M162 272 H218 M161 300 H219 M162 328 H218" stroke="#1f354c" stroke-width="2" opacity="0.8" fill="none"/>

    <!-- Glifos / Circuitos na Barriga -->
    <g id="skalito-belly-circuits">
      <rect x="186" y="278" width="8" height="8" fill="none" stroke="#00d9ff" stroke-width="2" transform="rotate(45 190 282)" filter="url(#skalito-soft-glow)"/>
      <rect x="187" y="306" width="6" height="6" fill="none" stroke="#00d9ff" stroke-width="1.8" transform="rotate(45 190 309)" opacity="0.85"/>
      <path d="M190 262 L190 274 M190 290 L190 302" stroke="#00d9ff" stroke-width="1.8" opacity="0.75"/>
    </g>
  </g>

  <!-- COWL / GOLA / CAPUZ CIBERNÉTICO COM EMBLEMA SKALEE -->
  <g id="skalito-cowl">
    <!-- Base da Gola -->
    <path
      d="
        M134 202
        C158 220 222 220 246 202
        L240 242
        C216 266 164 266 140 242
        Z
      "
      fill="#0b1320"
      stroke="#1e374f"
      stroke-width="3"
    />
    <!-- Borda Superior Iluminada -->
    <path d="M142 208 C166 224 214 224 238 208" fill="none" stroke="#00d9ff" stroke-width="3" opacity="0.9" filter="url(#skalito-soft-glow)"/>

    <!-- EMBLEMA SKALEE NO PEITO -->
    <g id="skalito-chest-badge" transform="translate(190, 234)">
      <!-- Diamante Skalee -->
      <rect x="-9" y="-9" width="18" height="18" fill="#0b1728" stroke="#00d9ff" stroke-width="2.5" transform="rotate(45)" filter="url(#skalito-soft-glow)"/>
      <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(45)"/>
      <!-- Texto Skalee estilizado -->
      <text x="14" y="3" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">Skalee</text>
    </g>
  </g>

  <!-- BRAÇO DIREITO (DESCANSO / APONTAR) -->
  <g id="skalito-arm-right">
    <path
      d="
        M236 244
        C266 248 280 274 272 298
        C267 315 250 314 240 302
        C232 292 230 274 232 258
        Z
      "
      fill="url(#skalito-body-gradient)"
      stroke="#1e344a"
      stroke-width="3"
    />
    <!-- Garras -->
    <circle cx="266" cy="304" r="3.5" fill="#09101a"/>
    <circle cx="258" cy="310" r="3.5" fill="#09101a"/>
    <circle cx="248" cy="308" r="3.5" fill="#09101a"/>
    <!-- Circuito Neon Ciano no Pulso -->
    <path d="M250 268 L264 262 L260 276" stroke="#00d9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#skalito-soft-glow)"/>
    <path d="M246 294 L260 290" stroke="#ff4057" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- BRAÇO ESQUERDO (ACENO / GESTOS INTERATIVOS) -->
  <g id="skalito-arm-left">
    <path
      d="
        M144 244
        C110 240 90 224 76 200
        C70 188 82 178 92 188
        C106 202 120 214 148 218
        Z
      "
      fill="url(#skalito-body-gradient)"
      stroke="#1e344a"
      stroke-width="3"
    />
    <!-- Dedinhos/Garras no Aceno -->
    <circle cx="78" cy="192" r="4" fill="#0d1827" stroke="#253a50" stroke-width="1.5"/>
    <circle cx="86" cy="184" r="4" fill="#0d1827" stroke="#253a50" stroke-width="1.5"/>
    <circle cx="96" cy="190" r="4" fill="#0d1827" stroke="#253a50" stroke-width="1.5"/>
    <!-- Linhas de Circuito Neon no Braço de Aceno -->
    <path d="M98 206 C88 200 84 196 80 188" fill="none" stroke="#00d9ff" stroke-width="2.5" stroke-linecap="round" filter="url(#skalito-soft-glow)"/>
    <path d="M120 228 L108 218" fill="none" stroke="#ff4057" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CABEÇA DO SKALITO -->
  <g id="skalito-head">
    
    <!-- CHIFRES METÁLICOS E CRISTA -->
    <g id="skalito-horns">
      <!-- Chifre Esquerdo -->
      <path
        d="M124 76 L94 28 C128 32 146 50 152 78 Z"
        fill="url(#skalito-horn-gradient)"
        stroke="#122436"
        stroke-width="3"
      />
      <!-- Chifre Direito -->
      <path
        d="M256 76 L286 28 C252 32 234 50 228 78 Z"
        fill="url(#skalito-horn-gradient)"
        stroke="#122436"
        stroke-width="3"
      />
      <!-- Espinhos Laterais das Bochechas -->
      <path d="M96 150 L68 136 L94 164 Z" fill="url(#skalito-horn-gradient)" stroke="#122436" stroke-width="2.5"/>
      <path d="M284 150 L312 136 L286 164 Z" fill="url(#skalito-horn-gradient)" stroke="#122436" stroke-width="2.5"/>
      <!-- Crista Central Superior -->
      <path
        d="M162 56 L175 14 L190 50 L205 12 L218 56"
        fill="url(#skalito-horn-gradient)"
        stroke="#162e45"
        stroke-width="3"
        stroke-linejoin="round"
      />
    </g>

    <!-- FORMATO DA CABEÇA (CHIBI DRAGON) -->
    <path
      d="
        M92 120
        C92 64 134 42 190 42
        C246 42 288 64 288 120
        C288 180 248 212 190 212
        C132 212 92 180 92 120
        Z
      "
      fill="url(#skalito-body-gradient)"
      stroke="#1b324a"
      stroke-width="3.5"
    />

    <!-- Contornos / Glows Laterais na Cabeça -->
    <path d="M98 110 C102 82 120 64 142 54" fill="none" stroke="#00d9ff" stroke-width="2.5" opacity="0.6" filter="url(#skalito-soft-glow)"/>
    <path d="M282 110 C278 82 260 64 238 54" fill="none" stroke="#00d9ff" stroke-width="2.5" opacity="0.8" filter="url(#skalito-soft-glow)"/>

    <!-- SÍMBOLO DA TESTA (DIAMANTE SKALEE + CHEVRON VERMELHO) -->
    <g id="skalito-forehead-symbol">
      <!-- Diamante Ciano Neon -->
      <rect
        x="176"
        y="62"
        width="28"
        height="28"
        fill="#071526"
        stroke="url(#skalito-cyan-gradient)"
        stroke-width="4.5"
        transform="rotate(45 190 76)"
        filter="url(#skalito-soft-glow)"
      />
      <rect
        x="182"
        y="68"
        width="16"
        height="16"
        fill="none"
        stroke="#00d9ff"
        stroke-width="2"
        transform="rotate(45 190 76)"
      />
      <!-- Chevron Vermelho Neon -->
      <path
        d="M180 108 L190 118 L200 108"
        fill="none"
        stroke="url(#skalito-red-gradient)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#skalito-soft-glow)"
      />
    </g>

    <!-- DETALHES DO ROSTO E SOBRANCELHAS CIBERNÉTICAS -->
    <g id="skalito-face-details">
      <!-- Sobrancelhas Neon Ciano -->
      <path d="M130 88 L146 80" stroke="#00d9ff" stroke-width="3.5" stroke-linecap="round" filter="url(#skalito-soft-glow)"/>
      <path d="M250 88 L234 80" stroke="#00d9ff" stroke-width="3.5" stroke-linecap="round" filter="url(#skalito-soft-glow)"/>
      
      <!-- Detalhes de Bochecha / Circuito -->
      <path d="M106 148 L118 142" stroke="#00d9ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M274 148 L262 142" stroke="#00d9ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- Narinas sutis -->
      <ellipse cx="178" cy="150" rx="2.5" ry="3" fill="#00d9ff" opacity="0.7"/>
      <ellipse cx="202" cy="150" rx="2.5" ry="3" fill="#00d9ff" opacity="0.7"/>
    </g>

    <!-- OLHO ESQUERDO (BRANCO BRILHANTE COM GLOW CIANO) -->
    <g id="skalito-eye-left">
      <ellipse
        cx="145"
        cy="124"
        rx="18"
        ry="25"
        fill="#ffffff"
        filter="url(#skalito-eye-glow)"
      />
      <!-- Reflexo / Brilho Suave -->
      <ellipse cx="140" cy="116" rx="6" ry="9" fill="#ffffff"/>
      <ellipse cx="152" cy="134" rx="3" ry="4" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- OLHO DIREITO (BRANCO BRILHANTE COM GLOW CIANO) -->
    <g id="skalito-eye-right">
      <ellipse
        cx="235"
        cy="124"
        rx="18"
        ry="25"
        fill="#ffffff"
        filter="url(#skalito-eye-glow)"
      />
      <!-- Reflexo / Brilho Suave -->
      <ellipse cx="230" cy="116" rx="6" ry="9" fill="#ffffff"/>
      <ellipse cx="242" cy="134" rx="3" ry="4" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- BOCA (COM ESTADOS IDLE E FELIZ) -->
    <g id="skalito-mouth">
      <path
        id="skalito-mouth-idle"
        d="M178 162 Q190 172 202 162"
        fill="none"
        stroke="#1c3044"
        stroke-width="3.5"
        stroke-linecap="round"
      />
      <path
        id="skalito-mouth-happy"
        d="M172 160 Q190 180 208 160"
        fill="none"
        stroke="#00d9ff"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0"
        filter="url(#skalito-soft-glow)"
      />
    </g>
  </g>

  <!-- PARTÍCULAS CYBER / EMBERS (FRENTE) -->
  <g id="skalito-particles">
    <circle id="skalito-particle-5" cx="80" cy="130" r="2.5" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-6" cx="295" cy="170" r="3" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-7" cx="190" cy="30" r="2" fill="#38bdf8" filter="url(#skalito-soft-glow)"/>
    <circle id="skalito-particle-8" cx="340" cy="330" r="2" fill="#00d9ff" filter="url(#skalito-soft-glow)"/>
  </g>
</svg>
