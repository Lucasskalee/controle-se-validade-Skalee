<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Animacao de montagem do Skalito</title>
  <desc id="desc">Animacao em SVG que alterna nove imagens do mascote Skalito, mostrando pecas e o personagem completo.</desc>
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="45%" r="54%">
      <stop offset="0%" stop-color="#effcff"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2f7"/>
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#11dff5" flood-opacity=".32"/>
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#071018" flood-opacity=".18"/>
    </filter>
    <style>
      :root {
        --duration: 10.8s;
      }

      .stage {
        fill: url(#stageGlow);
      }

      .halo {
        fill: none;
        stroke: #0bdff4;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 18 26;
        opacity: .45;
        transform-origin: 627px 627px;
        animation: haloSpin var(--duration) linear infinite;
      }

      .frame {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        filter: url(#cyanGlow);
        animation-duration: var(--duration);
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      .frame image {
        width: 1254px;
        height: 1254px;
      }

      .frame-1 { animation-name: showFrame1; }
      .frame-2 { animation-name: showFrame2; }
      .frame-3 { animation-name: showFrame3; }
      .frame-4 { animation-name: showFrame4; }
      .frame-5 { animation-name: showFrame5; }
      .frame-6 { animation-name: showFrame6; }
      .frame-7 { animation-name: showFrame7; }
      .frame-8 { animation-name: showFrame8; }
      .frame-9 { animation-name: showFrame9; }

      .pulse {
        fill: none;
        stroke: #ff3153;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 70 830;
        opacity: .8;
        transform-origin: 627px 627px;
        animation: pulseTrace var(--duration) ease-in-out infinite;
      }

      .label {
        font: 700 30px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #10202a;
      }

      .sub-label {
        font: 500 19px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #3e5560;
      }

      .label-group {
        opacity: 0;
        animation-duration: var(--duration);
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      .label-1 { animation-name: label1; }
      .label-2 { animation-name: label2; }
      .label-3 { animation-name: label3; }
      .label-4 { animation-name: label4; }
      .label-5 { animation-name: label5; }
      .label-6 { animation-name: label6; }
      .label-7 { animation-name: label7; }
      .label-8 { animation-name: label8; }
      .label-9 { animation-name: label9; }

      @keyframes haloSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulseTrace {
        0%, 100% { stroke-dashoffset: 0; opacity: .15; }
        36% { stroke-dashoffset: -280; opacity: .82; }
        72% { stroke-dashoffset: -650; opacity: .55; }
      }

      @keyframes showFrame1 {
        0%, 9.5% { opacity: 1; transform: scale(.92) rotate(-2deg); }
        11%, 100% { opacity: 0; transform: scale(.98) rotate(0deg); }
      }

      @keyframes showFrame2 {
        0%, 9% { opacity: 0; transform: scale(.94) rotate(2deg); }
        10.5%, 20.5% { opacity: 1; transform: scale(.98) rotate(0deg); }
        22%, 100% { opacity: 0; transform: scale(1.02) rotate(-1deg); }
      }

      @keyframes showFrame3 {
        0%, 20% { opacity: 0; transform: scale(.92) translateX(-18px); }
        21.5%, 31.5% { opacity: 1; transform: scale(.98) translateX(0); }
        33%, 100% { opacity: 0; transform: scale(1.01) translateX(10px); }
      }

      @keyframes showFrame4 {
        0%, 31% { opacity: 0; transform: scale(.92) rotate(-7deg); }
        32.5%, 42.5% { opacity: 1; transform: scale(.98) rotate(0deg); }
        44%, 100% { opacity: 0; transform: scale(1.01) rotate(3deg); }
      }

      @keyframes showFrame5 {
        0%, 42% { opacity: 0; transform: scale(.92) translateX(18px); }
        43.5%, 53.5% { opacity: 1; transform: scale(.98) translateX(0); }
        55%, 100% { opacity: 0; transform: scale(1.01) translateX(-10px); }
      }

      @keyframes showFrame6 {
        0%, 53% { opacity: 0; transform: scale(.92) rotate(7deg); }
        54.5%, 64.5% { opacity: 1; transform: scale(.98) rotate(0deg); }
        66%, 100% { opacity: 0; transform: scale(1.01) rotate(-3deg); }
      }

      @keyframes showFrame7 {
        0%, 64% { opacity: 0; transform: scale(.88) translateY(-20px); }
        65.5%, 75.5% { opacity: 1; transform: scale(.98) translateY(0); }
        77%, 100% { opacity: 0; transform: scale(1.01) translateY(12px); }
      }

      @keyframes showFrame8 {
        0%, 75% { opacity: 0; transform: scale(.9) translateY(20px); }
        76.5%, 86.5% { opacity: 1; transform: scale(.98) translateY(0); }
        88%, 100% { opacity: 0; transform: scale(1.01) translateY(-10px); }
      }

      @keyframes showFrame9 {
        0%, 86% { opacity: 0; transform: scale(.9); }
        88%, 97% { opacity: 1; transform: scale(.98); }
        100% { opacity: 0; transform: scale(1); }
      }

      @keyframes label1 { 0%, 9.5% { opacity: 1; } 11%, 100% { opacity: 0; } }
      @keyframes label2 { 0%, 9% { opacity: 0; } 10.5%, 20.5% { opacity: 1; } 22%, 100% { opacity: 0; } }
      @keyframes label3 { 0%, 20% { opacity: 0; } 21.5%, 31.5% { opacity: 1; } 33%, 100% { opacity: 0; } }
      @keyframes label4 { 0%, 31% { opacity: 0; } 32.5%, 42.5% { opacity: 1; } 44%, 100% { opacity: 0; } }
      @keyframes label5 { 0%, 42% { opacity: 0; } 43.5%, 53.5% { opacity: 1; } 55%, 100% { opacity: 0; } }
      @keyframes label6 { 0%, 53% { opacity: 0; } 54.5%, 64.5% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes label7 { 0%, 64% { opacity: 0; } 65.5%, 75.5% { opacity: 1; } 77%, 100% { opacity: 0; } }
      @keyframes label8 { 0%, 75% { opacity: 0; } 76.5%, 86.5% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @keyframes label9 { 0%, 86% { opacity: 0; } 88%, 97% { opacity: 1; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .halo,
        .pulse,
        .frame,
        .label-group {
          animation: none;
        }

        .frame-9,
        .label-9 {
          opacity: 1;
        }
      }
    </style>
  </defs>

  <rect class="stage" width="1254" height="1254"/>
  <circle class="halo" cx="627" cy="627" r="472"/>
  <circle class="pulse" cx="627" cy="627" r="506"/>

  <g class="frame frame-1">
    <image href="frame-01-ring-a.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-2">
    <image href="frame-02-ring-b.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-3">
    <image href="frame-03-wing-left.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-4">
    <image href="frame-04-arm-left.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-5">
    <image href="frame-05-wing-right.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-6">
    <image href="frame-06-arm-right.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-7">
    <image href="frame-07-head.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-8">
    <image href="frame-08-collar.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g class="frame frame-9">
    <image href="frame-09-full.jpg" x="0" y="0" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g transform="translate(627 1120)" text-anchor="middle">
    <g class="label-group label-1">
      <text class="label" y="0">Ativando aneis</text>
      <text class="sub-label" y="35">1 / 9</text>
    </g>
    <g class="label-group label-2">
      <text class="label" y="0">Calibrando nucleo</text>
      <text class="sub-label" y="35">2 / 9</text>
    </g>
    <g class="label-group label-3">
      <text class="label" y="0">Abrindo asa esquerda</text>
      <text class="sub-label" y="35">3 / 9</text>
    </g>
    <g class="label-group label-4">
      <text class="label" y="0">Conectando braco esquerdo</text>
      <text class="sub-label" y="35">4 / 9</text>
    </g>
    <g class="label-group label-5">
      <text class="label" y="0">Abrindo asa direita</text>
      <text class="sub-label" y="35">5 / 9</text>
    </g>
    <g class="label-group label-6">
      <text class="label" y="0">Conectando braco direito</text>
      <text class="sub-label" y="35">6 / 9</text>
    </g>
    <g class="label-group label-7">
      <text class="label" y="0">Ligando a cabeca</text>
      <text class="sub-label" y="35">7 / 9</text>
    </g>
    <g class="label-group label-8">
      <text class="label" y="0">Fixando a base Skalee</text>
      <text class="sub-label" y="35">8 / 9</text>
    </g>
    <g class="label-group label-9">
      <text class="label" y="0">Skalito completo</text>
      <text class="sub-label" y="35">9 / 9</text>
    </g>
  </g>
</svg>
