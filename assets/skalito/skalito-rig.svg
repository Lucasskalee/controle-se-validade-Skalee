    <g id="arm-right" class="skalito-piece piece-arm-right" data-pivot-x="616" data-pivot-y="576" style="transform-origin: 616px 576px;">
      <image href="arm-right.png" x="580" y="548" width="120" height="230" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="580" y="548" width="120" height="230" rx="0" ry="0" fill="none" display="none" />
