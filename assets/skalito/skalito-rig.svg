    <g id="arm-left" class="skalito-piece piece-arm-left" data-pivot-x="382" data-pivot-y="566" style="transform-origin: 382px 566px;">
      <image href="arm-left.png" x="126" y="462" width="292" height="190" preserveAspectRatio="xMidYMid meet" />
      <rect class="skalito-debug-box" x="126" y="462" width="292" height="190" rx="0" ry="0" fill="none" display="none" />
